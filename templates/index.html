<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>硬體效能測試軟體</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #fff; text-align: center; padding: 20px; }
        .card { background: #1e293b; max-width: 600px; margin: 20px auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        button { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; margin: 5px; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .danger { background: #dc2626; }
        .progress-bar { width: 100%; background: #334155; height: 20px; border-radius: 10px; overflow: hidden; margin: 15px 0; }
        .progress-fill { width: 0%; height: 100%; background: #3b82f6; transition: width 0.3s; }
        .score { font-size: 28px; color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>
    <h1>⚡ 本機硬體極限壓力測試</h1>
    
    <div class="card">
        <h3>💻 本機系統資訊</h3>
        <p>邏輯核心數：<span id="cpu-cores">偵測中...</span></p>
    </div>

    <div class="card">
        <h3>💻 CPU 多核烤機測試 (全速運算)</h3>
        <button id="start-btn" onclick="startBenchmark()">開始全核跑分</button>
        <button id="stop-btn" onclick="stopBenchmark()" class="danger" disabled>中止測試</button>
        
        <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
        <p>狀態：<span id="status-text">就緒</span></p>
        <p class="score">得分：<span id="score-text">-</span></p>
    </div>

    <script>
        let workers = [];
        let isRunning = false;
        let startTime, timerInterval;
        const duration = 300; // 5 分鐘測試 (300 秒)

        document.getElementById('cpu-cores').innerText = navigator.hardwareConcurrency || '未知';

        // 嵌入 Worker 運算邏輯
        const workerCode = `
            self.onmessage = function(e) {
                let iterations = 0;
                const endTime = Date.now() + (e.data.duration * 1000);
                
                while (Date.now() < endTime) {
                    // 極限質數與算術運算，強制吃滿核心
                    for (let i = 2; i < 3000; i++) {
                        let isPrime = true;
                        for (let j = 2; j <= Math.sqrt(i); j++) {
                            if (i % j === 0) { isPrime = false; break; }
                        }
                    }
                    iterations++;
                }
                self.postMessage(iterations);
            };
        `;

        function startBenchmark() {
            const threads = navigator.hardwareConcurrency || 4;
            workers = [];
            let completedWorkers = 0;
            let totalScore = 0;

            document.getElementById('start-btn').disabled = true;
            document.getElementById('stop-btn').disabled = false;
            document.getElementById('score-text').innerText = '計算中...';
            
            startTime = Date.now();
            isRunning = true;

            // 啟動進度條
            timerInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                const progress = Math.min(100, (elapsed / duration) * 100);
                document.getElementById('progress').style.width = progress + '%';
                document.getElementById('status-text').innerText = `極限烤機中... 剩餘 ${Math.max(0, Math.ceil(duration - elapsed))} 秒`;

                if (elapsed >= duration) {
                    clearInterval(timerInterval);
                }
            }, 500);

            const blob = new Blob([workerCode], { type: 'application/javascript' });
            const workerUrl = URL.createObjectURL(blob);

            // 依照 CPU 核心數量建立 Web Workers 抓滿 100% 效能
            for (let i = 0; i < threads; i++) {
                const worker = new Worker(workerUrl);
                workers.push(worker);

                worker.onmessage = function(e) {
                    totalScore += e.data;
                    completedWorkers++;

                    if (completedWorkers === threads) {
                        finishBenchmark(totalScore);
                    }
                };

                worker.postMessage({ duration: duration });
            }
        }

        function stopBenchmark() {
            if (!isRunning) return;
            workers.forEach(w => w.terminate());
            clearInterval(timerInterval);
            document.getElementById('status-text').innerText = '測試已手動中止';
            document.getElementById('start-btn').disabled = false;
            document.getElementById('stop-btn').disabled = true;
            document.getElementById('progress').style.width = '0%';
            isRunning = false;
        }

        function finishBenchmark(score) {
            document.getElementById('status-text').innerText = '測試完成！';
            document.getElementById('score-text').innerText = Math.round(score / 100);
            document.getElementById('start-btn').disabled = false;
            document.getElementById('stop-btn').disabled = true;
            isRunning = false;
        }
    </script>
</body>
</html>
