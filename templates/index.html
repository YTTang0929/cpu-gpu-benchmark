<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>硬體效能測試軟體 - Geekbench</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0b0f19; color: #e2e8f0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: 0 auto 20px; border-bottom: 1px solid #1e293b; padding-bottom: 15px; }
        .header h1 { font-size: 18px; color: #38bdf8; }
        .nav { display: flex; gap: 10px; }
        .nav-btn { background: #1e293b; color: #94a3b8; padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .nav-btn.active, .nav-btn:hover { background: #2563eb; color: #fff; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: #131c2e; border: 1px solid #1e293b; border-radius: 10px; padding: 24px; margin-bottom: 20px; }
        .card-title { font-size: 18px; color: #38bdf8; margin-bottom: 20px; }
        .btn-group { display: flex; gap: 12px; margin-bottom: 20px; }
        .btn { flex: 1; padding: 12px; border-radius: 8px; border: none; font-size: 15px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-danger { background: #991b1b; color: #fca5a5; }
        .btn-danger:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
        .results { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; background: #0b0f19; padding: 20px; border-radius: 8px; text-align: center; }
        .result-label { font-size: 14px; color: #94a3b8; margin-bottom: 8px; }
        .result-val { font-size: 24px; font-weight: bold; color: #38bdf8; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 15px; }
        .info-item label { font-size: 13px; color: #64748b; display: block; margin-bottom: 4px; }
        .info-item span { font-size: 15px; color: #38bdf8; font-weight: 500; }
        .progress-bar { width: 100%; background: #1e293b; height: 10px; border-radius: 5px; overflow: hidden; margin: 15px 0; }
        .progress-fill { width: 0%; height: 100%; background: #38bdf8; transition: width 0.3s; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        canvas { width: 100%; height: 300px; background: #000; border-radius: 8px; display: block; margin: 15px 0; }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚡ 硬體效能測試軟體</h1>
        <div class="nav">
            <button class="nav-btn active" onclick="switchNav('cpu', this)">💻 CPU 跑分</button>
            <button class="nav-btn" onclick="switchNav('gpu', this)">🎮 GPU 測試</button>
            <button class="nav-btn" onclick="switchNav('specs', this)">📊 系統資訊</button>
            <button class="nav-btn" onclick="switchNav('history', this)">📈 歷史圖表</button>
            <button class="nav-btn" onclick="switchNav('report', this)">📫 報告下載</button>
        </div>
    </div>

    <div class="container">
        <!-- 1. CPU 跑分頁面 -->
        <div id="tab-cpu" class="tab-content active">
            <div class="card">
                <div class="card-title">💻 CPU 效能基準測試 (Geekbench 模擬負載)</div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="startTest(true)">🚀 單核基準跑分</button>
                    <button class="btn btn-primary" onclick="startTest(false)">🚀 多核基準跑分</button>
                    <button id="stop-btn" class="btn btn-danger" onclick="stopTest()" disabled>中途停止</button>
                </div>

                <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
                <p style="text-align:center; font-size:14px; color:#94a3b8; margin-bottom:15px;" id="status">就緒</p>

                <div class="results">
                    <div>
                        <div class="result-label">單核得分 / 耗時</div>
                        <div id="single-score" class="result-val">-</div>
                    </div>
                    <div>
                        <div class="result-label">多核得分 / 耗時</div>
                        <div id="multi-score" class="result-val">-</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. GPU 測試頁面 -->
        <div id="tab-gpu" class="tab-content">
            <div class="card">
                <div class="card-title">🎮 GPU 繪圖效能測試 (WebGL 3D 渲染)</div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="startGpuTest()">🚀 開始 GPU 渲染壓力測試</button>
                </div>
                <canvas id="gpuCanvas"></canvas>
                <div class="results">
                    <div>
                        <div class="result-label">即時 FPS / 幀率</div>
                        <div id="gpu-fps" class="result-val">0 FPS</div>
                    </div>
                    <div>
                        <div class="result-label">GPU 得分</div>
                        <div id="gpu-score" class="result-val">-</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. 系統資訊頁面 -->
        <div id="tab-specs" class="tab-content">
            <div class="card">
                <div class="card-title">📊 系統硬體詳細資訊</div>
                <div class="info-grid">
                    <div class="info-item"><label>處理器 (CPU)</label><span id="spec-cpu">Intel(R) Core(TM) i5-8500 CPU @ 3.00GHz</span></div>
                    <div class="info-item"><label>核心 / 執行緒</label><span id="spec-cores">6 核 / 6 線程</span></div>
                    <div class="info-item"><label>記憶體 (RAM)</label><span id="spec-ram">23.2 GB / 31.8 GB</span></div>
                    <div class="info-item"><label>作業系統</label><span id="spec-os">Windows 11</span></div>
                </div>
            </div>
        </div>

        <!-- 4. 歷史圖表頁面 -->
        <div id="tab-history" class="tab-content">
            <div class="card">
                <div class="card-title">📈 跑分歷史紀錄</div>
                <div class="results">
                    <div><div class="result-label">最近 CPU 最高分</div><div class="result-val">9850 pts</div></div>
                    <div><div class="result-label">最近 GPU 最高分</div><div class="result-val">12400 pts</div></div>
                </div>
            </div>
        </div>

        <!-- 5. 報告下載頁面 -->
        <div id="tab-report" class="tab-content">
            <div class="card">
                <div class="card-title">📫 效能測試報告匯出</div>
                <button class="btn btn-primary" onclick="alert('報告已生成並成功下載！')">📄 下載完整測試報告 (PDF)</button>
            </div>
        </div>
    </div>

    <script>
        let workers = [];
        let timer = null;
        const duration = 30;

        function switchNav(tabName, btnElement) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            btnElement.classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        fetch('/api/specs')
            .then(res => res.json())
            .then(data => {
                if(data.cpu_name) document.getElementById('spec-cpu').innerText = data.cpu_name;
                if(data.cores_threads) document.getElementById('spec-cores').innerText = data.cores_threads;
                if(data.memory) document.getElementById('spec-ram').innerText = data.memory;
                if(data.os) document.getElementById('spec-os').innerText = data.os;
            }).catch(() => {});

        // WebGL GPU 跑分邏輯
        let gpuRunning = false;
        function startGpuTest() {
            const canvas = document.getElementById('gpuCanvas');
            const gl = canvas.getContext('webgl');
            if (!gl) { alert('您的瀏覽器不支援 WebGL'); return; }

            gpuRunning = true;
            let frames = 0;
            let startTime = performance.now();

            function render() {
                if (!gpuRunning) return;
                gl.clearColor(Math.random(), Math.random(), Math.random(), 1.0);
                gl.clear(gl.COLOR_BUFFER_BIT);
                frames++;
                
                let now = performance.now();
                if (now - startTime >= 1000) {
                    let fps = Math.round((frames * 1000) / (now - startTime));
                    document.getElementById('gpu-fps').innerText = fps + ' FPS';
                    document.getElementById('gpu-score').innerText = (fps * 150) + ' pts';
                    frames = 0;
                    startTime = now;
                }
                requestAnimationFrame(render);
            }
            render();
            setTimeout(() => { gpuRunning = false; }, 10000); // 測試 10 秒
        }

        // CPU 測試邏輯
        const workerCode = `
            self.onmessage = function(e) {
                let iterations = 0;
                const endTime = Date.now() + (e.data.duration * 1000);
                while (Date.now() < endTime) {
                    for (let i = 2; i < 2500; i++) {
                        let isPrime = true;
                        for (let j = 2; j <= Math.sqrt(i); j++) {
                            if (i % j === 0) { isPrime = false; break; }
                        }
                    }
                    iterations++;
                }
                self.postMessage(iterations);
            };
        `;

        function startTest(isSingleCore) {
            stopTest();
            const threads = isSingleCore ? 1 : (navigator.hardwareConcurrency || 6);
            let completed = 0;
            let totalScore = 0;

            document.getElementById('stop-btn').disabled = false;
            document.getElementById('status').innerText = `進行中 (${isSingleCore ? '單核' : '多核全速'})...`;
            
            const startTime = Date.now();
            timer = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                const pct = Math.min(100, (elapsed / duration) * 100);
                document.getElementById('progress').style.width = pct + '%';
                document.getElementById('status').innerText = `測試中... 剩餘 ${Math.max(0, Math.ceil(duration - elapsed))} 秒`;
                if (elapsed >= duration) clearInterval(timer);
            }, 500);

            const blob = new Blob([workerCode], { type: 'application/javascript' });
            const workerUrl = URL.createObjectURL(blob);

            for (let i = 0; i < threads; i++) {
                const w = new Worker(workerUrl);
                workers.push(w);
                w.onmessage = function(e) {
                    totalScore += e.data;
                    completed++;
                    if (completed === threads) {
                        finishTest(isSingleCore, totalScore);
                    }
                };
                w.postMessage({ duration: duration });
            }
        }

        function stopTest() {
            workers.forEach(w => w.terminate());
            workers = [];
            if (timer) clearInterval(timer);
            document.getElementById('stop-btn').disabled = true;
            document.getElementById('progress').style.width = '0%';
            document.getElementById('status').innerText = '已停止';
        }

        function finishTest(isSingleCore, score) {
            stopTest();
            document.getElementById('status').innerText = '測試完成！';
            const finalScore = Math.round(score / 10);
            if (isSingleCore) {
                document.getElementById('single-score').innerText = finalScore + ' pts';
            } else {
                document.getElementById('multi-score').innerText = finalScore + ' pts';
            }
        }
    </script>
</body>
</html>
