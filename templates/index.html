<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>硬體效能測試軟體 - Geekbench 模式</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #2563eb;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: #090d16;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 25px;
            border-bottom: 1px solid #334155;
        }
        .navbar .logo { font-size: 1.1rem; font-weight: bold; color: #60a5fa; }
        .nav-links { display: flex; gap: 8px; }
        
        .nav-item {
            color: var(--text-sub);
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            transition: 0.2s;
        }
        .nav-item.active, .nav-item:hover {
            background-color: var(--accent-blue);
            color: white;
        }

        .container {
            max-width: 850px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .view-section { display: none; }
        .view-section.active { display: block; }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 0;
            color: #60a5fa;
            border-left: 4px solid var(--accent-blue);
            padding-left: 10px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            background: #090d16;
            padding: 16px;
            border-radius: 8px;
        }
        .info-item label { color: var(--text-sub); font-size: 0.85rem; display: block; }
        .info-item span { font-weight: bold; color: #38bdf8; }

        .btn-group { display: flex; gap: 8px; margin-top: 20px; width: 100%; }
        button.action-btn {
            flex: 1; padding: 10px 4px; white-space: nowrap;
            border: none; border-radius: 8px; font-weight: bold;
            cursor: pointer; color: white; transition: 0.2s; font-size: 0.88rem;
        }
        .btn-blue { background-color: var(--accent-blue); }
        .btn-blue:hover { background-color: #1d4ed8; }
        .btn-red { background-color: var(--accent-red); }
        .btn-red:hover { background-color: #dc2626; }
        .btn-green { background-color: var(--accent-green); }
        .btn-green:hover { background-color: #059669; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        #webgl-canvas { width: 100%; height: 380px; background-color: #000; border-radius: 8px; margin-top: 15px; }

        .result-box {
            display: flex; justify-content: space-around;
            background-color: #090d16; padding: 15px; border-radius: 8px; margin-top: 15px;
        }
        .result-item { text-align: center; }
        .result-value { font-size: 1.4rem; font-weight: bold; color: #38bdf8; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">⚡ 硬體效能測試軟體</div>
        <div class="nav-links">
            <div class="nav-item active" onclick="switchView('cpu-sec', this)">💻 CPU 跑分</div>
            <div class="nav-item" onclick="switchView('gpu-sec', this)">🎮 GPU 測試</div>
            <div class="nav-item" onclick="switchView('info-sec', this)">📊 系統資訊</div>
            <div class="nav-item" onclick="switchView('history-sec', this)">📈 歷史圖表</div>
            <div class="nav-item" onclick="switchView('export-sec', this)">📥 報告下載</div>
        </div>
    </div>

    <div class="container">

        <!-- 畫面 1：CPU Geekbench 基準測試 -->
        <div id="cpu-sec" class="view-section active">
            <div class="card">
                <h2>💻 CPU 效能基準測試 (Geekbench 模擬負載)</h2>
                <div class="btn-group">
                    <button class="action-btn btn-blue" id="btn-single" onclick="runSingleCore()">🚀 單核基準跑分</button>
                    <button class="action-btn btn-blue" id="btn-multi" onclick="runMultiCore()">🚀 多核基準跑分</button>
                    <button class="action-btn btn-red" id="btn-stop-cpu" disabled onclick="stopCpu()">中途停止</button>
                </div>
                <div class="result-box">
                    <div class="result-item"><div>單核得分 / 耗時</div><div class="result-value" id="single-res">-</div></div>
                    <div class="result-item"><div>多核得分 / 耗時</div><div class="result-value" id="multi-res">-</div></div>
                </div>
            </div>
        </div>

        <!-- 畫面 2：GPU 測試 -->
        <div id="gpu-sec" class="view-section">
            <div class="card">
                <h2>🎮 GPU 3D 渲染壓力測試</h2>
                <canvas id="webgl-canvas"></canvas>
                <div class="btn-group">
                    <button class="action-btn btn-blue" id="gpu-btn" onclick="startGpuBenchmark()">🚀 開始 GPU 測試</button>
                    <button class="action-btn btn-red" id="gpu-stop-btn" onclick="stopGpuBenchmark()" disabled>⏹️ 中途停止測試</button>
                </div>
                <div class="result-box">
                    <div class="result-item"><div>平均 FPS</div><div class="result-value" id="gpu-fps">-</div></div>
                    <div class="result-item"><div>GPU 效能得分</div><div class="result-value" id="gpu-score">-</div></div>
                </div>
            </div>
        </div>

        <!-- 畫面 3：系統資訊 -->
        <div id="info-sec" class="view-section">
            <div class="card">
                <h2>📊 系統硬體詳細資訊</h2>
                <div class="info-grid">
                    <div class="info-item"><label>處理器 (CPU)</label><span id="info-cpu">讀取中...</span></div>
                    <div class="info-item"><label>核心 / 執行緒</label><span id="info-cores">讀取中...</span></div>
                    <div class="info-item"><label>記憶體 (RAM)</label><span id="info-ram">讀取中...</span></div>
                    <div class="info-item"><label>作業系統</label><span id="info-os">讀取中...</span></div>
                </div>
            </div>
        </div>

        <!-- 畫面 4：歷史圖表 -->
        <div id="history-sec" class="view-section">
            <div class="card">
                <h2>📈 歷史跑分圖表監視器</h2>
                <canvas id="historyChart" style="width:100%; height:380px;"></canvas>
                <div class="btn-group" style="margin-top:20px;">
                    <button class="action-btn btn-red" onclick="clearHistory()">🗑️ 清除歷史紀錄</button>
                </div>
            </div>
        </div>

        <!-- 畫面 5：報告下載 -->
        <div id="export-sec" class="view-section">
            <div class="card">
                <h2>📥 測試報告下載與匯出</h2>
                <p style="color: var(--text-sub);">選擇您要匯出的測試報告格式：</p>
                <div class="btn-group">
                    <button class="action-btn btn-green" onclick="exportJSON()">📄 匯出 JSON 數據報告</button>
                    <button class="action-btn btn-green" onclick="window.print()">🖨️ 列印 / 下載 PDF 報告</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        let cpuEventSource = null;
        let gpuAnimationId = null;
        let isGpuTesting = false;

        let benchmarkHistory = JSON.parse(localStorage.getItem('bench_history') || '[]');
        let historyChart = null;

        function switchView(secId, el) {
            document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            
            document.getElementById(secId).classList.add('active');
            el.classList.add('active');

            if (secId === 'history-sec') renderHistoryChart();
        }

        // 讀取系統資訊
        fetch('/api/system_info')
            .then(res => res.json())
            .then(data => {
                document.getElementById('info-cpu').innerText = data.cpu_model;
                document.getElementById('info-cores').innerText = `${data.cpu_cores} 核 / ${data.cpu_threads} 線程`;
                document.getElementById('info-ram').innerText = `${data.ram_available} / ${data.ram_total}`;
                document.getElementById('info-os').innerText = data.os_system;
            });

        // 單核 Geekbench 跑分呼叫
        function runSingleCore() {
            setCpuButtons(true);
            document.getElementById('single-res').innerText = "運算中...";
            cpuEventSource = new EventSource('/api/run-single-stream');
            cpuEventSource.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.status === 'completed') {
                    document.getElementById('single-res').innerText = `${data.single_score} 分 (${data.single_time})`;
                    saveRecord('Single CPU (Geekbench)', data.single_score);
                    cpuEventSource.close();
                    setCpuButtons(false);
                }
            };
        }

        // 多核 Geekbench 跑分呼叫
        function runMultiCore() {
            setCpuButtons(true);
            document.getElementById('multi-res').innerText = "多核負載運算中...";
            cpuEventSource = new EventSource('/api/run-multi-stream');
            cpuEventSource.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.status === 'completed') {
                    document.getElementById('multi-res').innerText = `${data.multi_score} 分 (${data.multi_time})`;
                    saveRecord('Multi CPU (Geekbench)', data.multi_score);
                    cpuEventSource.close();
                    setCpuButtons(false);
                }
            };
        }

        function stopCpu() {
            if (cpuEventSource) cpuEventSource.close();
            setCpuButtons(false);
            document.getElementById('single-res').innerText = "已停止";
            document.getElementById('multi-res').innerText = "已停止";
        }

        function setCpuButtons(isTesting) {
            document.getElementById('btn-single').disabled = isTesting;
            document.getElementById('btn-multi').disabled = isTesting;
            document.getElementById('btn-stop-cpu').disabled = !isTesting;
        }

        // GPU 測試邏輯
        function startGpuBenchmark() {
            const btn = document.getElementById('gpu-btn');
            const stopBtn = document.getElementById('gpu-stop-btn');
            const canvas = document.getElementById('webgl-canvas');

            btn.disabled = true;
            stopBtn.disabled = false;
            isGpuTesting = true;

            canvas.width = canvas.clientWidth || 800;
            canvas.height = canvas.clientHeight || 380;

            const gl = canvas.getContext('webgl');
            if (!gl) { alert('瀏覽器不支援 WebGL'); setGpuButtonsState(false); return; }

            const vsSource = `
                attribute vec3 aPosition; uniform float uTime; varying vec3 vColor;
                void main() {
                    vec3 pos = aPosition;
                    pos.x += sin(uTime * 0.5 + pos.y * 10.0) * 0.2;
                    pos.y += cos(uTime * 0.3 + pos.x * 10.0) * 0.2;
                    vColor = vec3(sin(pos.x * 10.0 + uTime) * 0.5 + 0.5, cos(pos.y * 10.0) * 0.5 + 0.5, 0.8);
                    gl_Position = vec4(pos * 0.8, 1.0); gl_PointSize = 3.0;
                }
            `;
            const fsSource = `
                precision mediump float; varying vec3 vColor;
                void main() {
                    if (length(gl_PointCoord - vec2(0.5)) > 0.5) discard;
                    gl_FragColor = vec4(vColor, 0.8);
                }
            `;

            function createShader(gl, type, source) {
                const s = gl.createShader(type); gl.shaderSource(s, source); gl.compileShader(s); return s;
            }

            const program = gl.createProgram();
            gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
            gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
            gl.linkProgram(program); gl.useProgram(program);

            const particleCount = 150000;
            const positions = new Float32Array(particleCount * 3);
            for (let i = 0; i < particleCount * 3; i++) positions[i] = (Math.random() - 0.5) * 2.2;

            const buffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
            gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

            const aPosition = gl.getAttribLocation(program, 'aPosition');
            gl.enableVertexAttribArray(aPosition);
            gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 0, 0);

            const uTime = gl.getUniformLocation(program, 'uTime');
            gl.viewport(0, 0, canvas.width, canvas.height);

            let frameCount = 0;
            let startTime = performance.now();
            const duration = 600; // 預設 600 秒基準 GPU 測試

            function render() {
                if (!isGpuTesting) return;
                const elapsed = (performance.now() - startTime) / 1000;
                btn.innerText = `⏳ GPU 測試中 (${Math.ceil(duration - elapsed)}s)...`;

                gl.clearColor(0.05, 0.05, 0.1, 1.0);
                gl.clear(gl.COLOR_BUFFER_BIT);
                gl.uniform1f(uTime, elapsed);
                gl.drawArrays(gl.POINTS, 0, particleCount);

                frameCount++;
                if (elapsed < duration) {
                    gpuAnimationId = requestAnimationFrame(render);
                } else {
                    const fps = (frameCount / elapsed).toFixed(1);
                    const score = Math.round(fps * 150);
                    document.getElementById('gpu-fps').innerText = fps;
                    document.getElementById('gpu-score').innerText = score;
                    saveRecord('GPU 3D', score);
                    setGpuButtonsState(false);
                    btn.innerText = "🚀 重新測試 GPU";
                }
            }
            render();
        }

        function stopGpuBenchmark() {
            isGpuTesting = false;
            if (gpuAnimationId) cancelAnimationFrame(gpuAnimationId);
            setGpuButtonsState(false);
            document.getElementById('gpu-btn').innerText = "🚀 開始 GPU 測試";
        }

        function setGpuButtonsState(isTesting) {
            document.getElementById('gpu-btn').disabled = isTesting;
            document.getElementById('gpu-stop-btn').disabled = !isTesting;
        }

        function saveRecord(type, score) {
            const timeStr = new Date().toLocaleTimeString();
            benchmarkHistory.push({ time: timeStr, type: type, score: score });
            localStorage.setItem('bench_history', JSON.stringify(benchmarkHistory));
        }

        function renderHistoryChart() {
            const ctx = document.getElementById('historyChart').getContext('2d');
            if (historyChart) historyChart.destroy();

            const labels = benchmarkHistory.map(item => `${item.time} (${item.type})`);
            const data = benchmarkHistory.map(item => item.score);

            historyChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '跑分歷史紀錄',
                        data: data,
                        borderColor: '#38bdf8',
                        backgroundColor: 'rgba(56, 189, 248, 0.2)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: { responsive: true, scales: { y: { beginAtZero: true } } }
            });
        }

        function clearHistory() {
            benchmarkHistory = [];
            localStorage.removeItem('bench_history');
            renderHistoryChart();
        }

        function exportJSON() {
            const report = {
                cpu_single: document.getElementById('single-res').innerText,
                cpu_multi: document.getElementById('multi-res').innerText,
                gpu_score: document.getElementById('gpu-score').innerText,
                history: benchmarkHistory
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(report, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `benchmark_report_${Date.now()}.json`);
            dlAnchor.click();
        }
    </script>
</body>
</html>
