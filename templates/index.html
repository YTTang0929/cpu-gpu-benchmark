<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>硬體效能測試軟體</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #151d2a;
            --accent-blue: #2563eb;
            --accent-light: #38bdf8;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --danger-red: #ef4444;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background-color: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #1e293b;
        }
        .logo { font-weight: bold; font-size: 16px; color: var(--accent-light); }
        .nav-items { display: flex; gap: 8px; }
        .nav-btn {
            background: transparent;
            color: var(--text-sub);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .nav-btn.active { background-color: var(--accent-blue); color: #fff; }

        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
            margin-bottom: 24px;
        }
        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 4px solid var(--accent-blue);
            padding-left: 10px;
        }

        .btn-group { display: flex; gap: 12px; margin-bottom: 20px; }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            color: #ffffff !important;
            transition: opacity 0.2s, transform 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-primary { background-color: #2563eb !important; }
        .btn-multi { background-color: #7c3aed !important; }
        .btn-danger { background-color: var(--danger-red) !important; }

        .progress-container {
            background-color: #0f172a;
            border-radius: 20px;
            height: 12px;
            overflow: hidden;
            margin: 15px 0;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #38bdf8, #3b82f6);
            transition: width 0.1s linear;
        }
        .status-text {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-sub);
        }

        .score-board {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            background-color: #0d131f;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-top: 20px;
        }
        .score-val { font-size: 28px; font-weight: bold; color: var(--accent-light); margin-top: 8px; }

        #gpu-canvas { width: 100%; height: 280px; background-color: #000; border-radius: 8px; }

        @media print {
            body { background-color: #fff !important; color: #000 !important; }
            .navbar, .btn-group, .progress-container, .status-text, .btn-danger, #gpu-canvas { display: none !important; }
            .container { max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
            .tab-panel { display: block !important; }
            .card { background-color: #fff !important; color: #000 !important; box-shadow: none !important; border: 1px solid #ccc !important; page-break-inside: avoid; }
            .card-title { border-left: 4px solid #000 !important; color: #000 !important; }
            .score-board { background-color: #f8fafc !important; border: 1px solid #e2e8f0 !important; }
            .score-val { color: #0284c7 !important; }
            #tab-report p { display: none; }
            
            body::before {
                content: "硬體效能與熱降頻實驗測試分析報告";
                display: block;
                text-align: center;
                font-size: 22px;
                font-weight: bold;
                margin-bottom: 20px;
                padding-bottom: 10px;
                border-bottom: 2px solid #000;
            }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">💻 硬體效能測試軟體</div>
        <div class="nav-items">
            <button class="nav-btn active" onclick="showTab('cpu', event)">💻 CPU 跑分</button>
            <button class="nav-btn" onclick="showTab('gpu', event)">🎮 GPU 測試</button>
            <button class="nav-btn" onclick="showTab('history', event)">📈 歷史圖表</button>
            <button class="nav-btn" onclick="showTab('report', event)">📫 報告下載</button>
        </div>
    </div>

    <div class="container">

        <!-- CPU 頁籤 -->
        <div id="tab-cpu" class="tab-panel active">
            <div class="card">
                <div class="card-title">CPU 5分鐘長效熱降頻測試數據</div>
                
                <div class="btn-group">
                    <button id="single-btn" class="btn btn-primary" onclick="runCpuTest('single')">🚀 單核 5分鐘壓力測試</button>
                    <button id="multi-btn" class="btn btn-multi" onclick="runCpuTest('multi')">🔥 多核 5分鐘滿載測試</button>
                    <button class="btn btn-danger" onclick="stopTest()">中途停止</button>
                </div>

                <div class="status-text">
                    <span id="cpu-status-msg">等待測試啟動...</span>
                    <span id="cpu-progress-percent">0.0%</span>
                </div>
                <div class="progress-container">
                    <div id="cpu-progress-bar" class="progress-bar"></div>
                </div>

                <div class="score-board">
                    <div>
                        <div style="font-size:13px; color:var(--text-sub);">單核 5分鐘綜合算力</div>
                        <div id="single-score" class="score-val">-</div>
                    </div>
                    <div>
                        <div style="font-size:13px; color:var(--text-sub);">多核 5分鐘綜合算力</div>
                        <div id="multi-score" class="score-val">-</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- GPU 頁籤 -->
        <div id="tab-gpu" class="tab-panel">
            <div class="card">
                <div class="card-title">GPU 5分鐘巨量粒子滿載測試數據</div>
                <canvas id="gpu-canvas"></canvas>

                <div class="status-text" style="margin-top: 15px;">
                    <span id="gpu-status-msg">等待測試啟動...</span>
                    <span id="gpu-progress-percent">0.0%</span>
                </div>
                <div class="progress-container">
                    <div id="gpu-progress-bar" class="progress-bar"></div>
                </div>

                <div class="btn-group" style="margin-top: 15px;">
                    <button id="gpu-start-btn" class="btn btn-primary" onclick="runGpuTest()">🎆 啟動 5分鐘巨量粒子燒機</button>
                    <button class="btn btn-danger" onclick="stopGpuTest()">中途停止測試</button>
                </div>
                <div class="score-board">
                    <div>
                        <div style="font-size:13px; color:var(--text-sub);">即時 / 平均 FPS</div>
                        <div id="gpu-fps" class="score-val">-</div>
                    </div>
                    <div>
                        <div style="font-size:13px; color:var(--text-sub);">GPU 5分鐘算力得分</div>
                        <div id="gpu-score" class="score-val">-</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 歷史圖表頁籤 -->
        <div id="tab-history" class="tab-panel">
            <div class="card">
                <div class="card-title">💻 CPU 熱降頻歷史趨勢曲線</div>
                <div style="height: 260px;">
                    <canvas id="cpuChart"></canvas>
                </div>
            </div>

            <div class="card">
                <div class="card-title">🎮 GPU 影格歷史趨勢曲線</div>
                <div style="height: 260px;">
                    <canvas id="gpuChart"></canvas>
                </div>
            </div>

            <button class="btn btn-danger" style="margin-bottom: 24px; width:100%;" onclick="clearHistory()">🗑️ 清除所有歷史紀錄</button>
        </div>

        <!-- 報告下載頁籤 -->
        <div id="tab-report" class="tab-panel">
            <div class="card">
                <div class="card-title">測試報告下載與匯出</div>
                <p style="color:var(--text-sub); font-size:14px; margin-bottom: 20px;">請選擇欲匯出的實驗數據與分析報告格式：</p>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="exportCSV()">📊 匯出 CSV 數據報表 (Excel 適用)</button>
                    <button class="btn btn-multi" onclick="printReport()">🖨️ 列印 / 下載 PDF 報告</button>
                </div>
            </div>
        </div>

    </div>

<script>
    function showTab(tabName, evt) {
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
        
        if (evt) evt.target.classList.add('active');
        document.getElementById(`tab-${tabName}`).classList.add('active');

        if (tabName === 'history') updateCharts();
    }

    function printReport() {
        updateCharts();
        setTimeout(() => {
            window.print();
        }, 300);
    }

    let cpuHistoryData = [];
    let gpuHistoryData = [];
    
    let activeWorkers = [];
    let isTesting = false;
    let timerInterval = null;

    let cpuChart = null;
    let gpuChart = null;

    document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
            if (isGpuTesting) stopGpuTest();
            if (isTesting) stopTest();
        }
    });

    const workerScript = `
        self.onmessage = function(e) {
            if (e.data.cmd === 'start') {
                let a = 1.000001, b = 1.000002;
                let ops = 0;
                while (true) {
                    a = a * b + 0.000001;
                    b = b * 0.999999 + a;
                    ops++;
                    if (ops >= 5000000) {
                        self.postMessage({ type: 'progress', ops: ops });
                        ops = 0;
                    }
                }
            }
        };
    `;

    function runCpuTest(type) {
        if (isTesting) return;
        isTesting = true;
        cpuHistoryData = [];

        const TEST_DURATION_SECONDS = 300;
        const cores = type === 'multi' ? (navigator.hardwareConcurrency || 4) : 1;
        
        let totalOpsCompleted = 0; 
        let lastSampleOps = 0;
        const startTime = Date.now();

        document.getElementById('single-btn').disabled = true;
        document.getElementById('multi-btn').disabled = true;

        const blob = new Blob([workerScript], { type: 'application/javascript' });
        activeWorkers = [];

        for (let i = 0; i < cores; i++) {
            const w = new Worker(URL.createObjectURL(blob));
            w.onmessage = function(e) {
                if (e.data.type === 'progress') {
                    totalOpsCompleted += e.data.ops;
                }
            };
            activeWorkers.push(w);
            w.postMessage({ cmd: 'start' });
        }

        let secondsPassed = 0;
        timerInterval = setInterval(() => {
            const elapsed = (Date.now() - startTime) / 1000;
            const remaining = Math.max(0, TEST_DURATION_SECONDS - elapsed);
            const pct = Math.min(100, (elapsed / TEST_DURATION_SECONDS) * 100);

            const mins = Math.floor(remaining / 60);
            const secs = Math.floor(remaining % 60).toString().padStart(2, '0');

            document.getElementById('cpu-progress-bar').style.width = `${pct}%`;
            document.getElementById('cpu-progress-percent').innerText = `${pct.toFixed(1)}%`;
            document.getElementById('cpu-status-msg').innerText = `🔥 全速燒機中... 剩餘時間 ${mins}:${secs}`;

            secondsPassed++;
            if (secondsPassed % 10 === 0 && elapsed > 0) {
                const currentBatchOps = totalOpsCompleted - lastSampleOps;
                lastSampleOps = totalOpsCompleted;
                const instantScore = Math.round(currentBatchOps / 10000000);
                saveCpuHistory(`${mins}:${secs}`, instantScore);
            }

            if (elapsed >= TEST_DURATION_SECONDS) {
                clearInterval(timerInterval);
                stopAllWorkers();

                const finalScore = Math.round((totalOpsCompleted / elapsed) / 1000000);
                document.getElementById('cpu-status-msg').innerText = `5 分鐘燒機測試完成！`;

                if (type === 'single') document.getElementById('single-score').innerText = finalScore;
                else document.getElementById('multi-score').innerText = finalScore;

                saveCpuHistory('00:00', finalScore);
                resetButtons();
            }
        }, 1000);
    }

    function stopAllWorkers() {
        activeWorkers.forEach(w => w.terminate());
        activeWorkers = [];
    }

    function stopTest() {
        if(timerInterval) clearInterval(timerInterval);
        stopAllWorkers();
        resetButtons();
        document.getElementById('cpu-status-msg').innerText = "測試已手動中途停止";
        document.getElementById('cpu-progress-bar').style.width = `0%`;
        document.getElementById('cpu-progress-percent').innerText = `0.0%`;
    }

    function resetButtons() {
        isTesting = false;
        document.getElementById('single-btn').disabled = false;
        document.getElementById('multi-btn').disabled = false;
    }

    let gpuAnimation = null;
    let glContext = null;
    let isGpuTesting = false;
    let gpuIntervalId = null;

    function runGpuTest() {
        if (isGpuTesting) return;
        isGpuTesting = true;
        gpuHistoryData = [];

        const canvas = document.getElementById('gpu-canvas');
        glContext = canvas.getContext('webgl');
        if (!glContext) {
            alert("您的瀏覽器不支援 WebGL");
            isGpuTesting = false;
            return;
        }

        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;

        const gl = glContext;
        
        const vsSource = `
            attribute vec2 a_position;
            attribute float a_size;
            void main() {
                gl_Position = vec4(a_position, 0.0, 1.0);
                gl_PointSize = a_size;
            }
        `;
        const fsSource = `
            precision mediump float;
            void main() {
                float dist = length(gl_PointCoord - vec2(0.5));
                if (dist > 0.5) discard;
                gl_FragColor = vec4(0.2, 0.7, 1.0, 0.8);
            }
        `;

        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            return shader;
        }

        const program = gl.createProgram();
        gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
        gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
        gl.linkProgram(program);
        gl.useProgram(program);

        const numParticles = 50000;
        const positions = new Float32Array(numParticles * 2);
        const velocities = new Float32Array(numParticles * 2);
        const sizes = new Float32Array(numParticles);

        for (let i = 0; i < numParticles; i++) {
            positions[i * 2] = (Math.random() - 0.5) * 2;
            positions[i * 2 + 1] = (Math.random() - 0.5) * 2;
            velocities[i * 2] = (Math.random() - 0.5) * 0.02;
            velocities[i * 2 + 1] = (Math.random() - 0.5) * 0.02;
            sizes[i] = Math.random() * 4.0 + 1.0;
        }

        const posBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, positions, gl.DYNAMIC_DRAW);

        const posLoc = gl.getAttribLocation(program, "a_position");
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

        const sizeBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, sizeBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, sizes, gl.STATIC_DRAW);

        const sizeLoc = gl.getAttribLocation(program, "a_size");
        gl.enableVertexAttribArray(sizeLoc);
        gl.vertexAttribPointer(sizeLoc, 1, gl.FLOAT, false, 0, 0);

        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE);

        let frames = 0;
        let lastSampleFrames = 0;
        const startTime = Date.now();
        const TEST_DURATION = 300;
        document.getElementById('gpu-start-btn').disabled = true;

        let secondsPassed = 0;
        gpuIntervalId = setInterval(() => {
            secondsPassed++;
            const elapsed = (Date.now() - startTime) / 1000;
            const remaining = Math.max(0, TEST_DURATION - elapsed);
            const pct = Math.min(100, (elapsed / TEST_DURATION) * 100);

            const mins = Math.floor(remaining / 60);
            const secs = Math.floor(remaining % 60).toString().padStart(2, '0');

            document.getElementById('gpu-progress-bar').style.width = `${pct}%`;
            document.getElementById('gpu-progress-percent').innerText = `${pct.toFixed(1)}%`;
            document.getElementById('gpu-status-msg').innerText = `🔥 巨量粒子渲染中... 剩餘時間 ${mins}:${secs}`;
            
            if (secondsPassed % 10 === 0 && elapsed > 0) {
                const instantFps = Math.round((frames - lastSampleFrames) / 10);
                lastSampleFrames = frames;
                document.getElementById('gpu-fps').innerText = instantFps;
                saveGpuHistory(`${mins}:${secs}`, instantFps);
            }
        }, 1000);

        function render() {
            frames++;
            const elapsed = (Date.now() - startTime) / 1000;

            for (let i = 0; i < numParticles; i++) {
                positions[i * 2] += velocities[i * 2];
                positions[i * 2 + 1] += velocities[i * 2 + 1];

                if (positions[i * 2] < -1 || positions[i * 2] > 1) velocities[i * 2] *= -1;
                if (positions[i * 2 + 1] < -1 || positions[i * 2 + 1] > 1) velocities[i * 2 + 1] *= -1;
            }

            gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
            gl.bufferSubData(gl.ARRAY_BUFFER, 0, positions);

            gl.viewport(0, 0, canvas.width, canvas.height);
            gl.clearColor(0.05, 0.05, 0.1, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT);

            gl.drawArrays(gl.POINTS, 0, numParticles);

            if (elapsed < TEST_DURATION && isGpuTesting) {
                gpuAnimation = requestAnimationFrame(render);
            } else if (isGpuTesting) {
                clearInterval(gpuIntervalId);
                const avgFps = Math.round(frames / elapsed);
                const finalScore = avgFps * 250;

                document.getElementById('gpu-fps').innerText = avgFps;
                document.getElementById('gpu-score').innerText = finalScore;
                document.getElementById('gpu-status-msg').innerText = `5 分鐘 GPU 燒機測試完成！`;
                document.getElementById('gpu-progress-bar').style.width = `100%`;
                document.getElementById('gpu-progress-percent').innerText = `100.0%`;
                document.getElementById('gpu-start-btn').disabled = false;
                
                saveGpuHistory('00:00', avgFps);
                isGpuTesting = false;
            }
        }
        render();
    }

    function stopGpuTest() {
        isGpuTesting = false;
        if (gpuAnimation) cancelAnimationFrame(gpuAnimation);
        if (gpuIntervalId) clearInterval(gpuIntervalId);
        document.getElementById('gpu-start-btn').disabled = false;
        document.getElementById('gpu-status-msg').innerText = "測試已手動中途停止";
        document.getElementById('gpu-progress-bar').style.width = `0%`;
        document.getElementById('gpu-progress-percent').innerText = `0.0%`;
    }

    function updateCharts() {
        const cpuCtx = document.getElementById('cpuChart').getContext('2d');
        if (cpuChart) cpuChart.destroy();
        cpuChart = new Chart(cpuCtx, {
            type: 'line',
            data: {
                labels: cpuHistoryData.length ? cpuHistoryData.map(d => d.time) : ['無測試數據'],
                datasets: [{
                    label: 'CPU 算力曲線',
                    data: cpuHistoryData.length ? cpuHistoryData.map(d => d.score) : [0],
                    borderColor: '#2563eb',
                    backgroundColor: 'rgba(37, 99, 235, 0.1)',
                    fill: true,
                    tension: 0.3,
                    pointRadius: 3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        ticks: { color: '#475569', autoSkip: true, maxTicksLimit: 8 },
                        title: { display: true, text: '測試倒數時間 (分:秒)', color: '#475569' }
                    },
                    y: {
                        beginAtZero: true,
                        ticks: { color: '#475569' },
                        title: { display: true, text: '算力得分 (Ops/s)', color: '#475569' }
                    }
                }
            }
        });

        const gpuCtx = document.getElementById('gpuChart').getContext('2d');
        if (gpuChart) gpuChart.destroy();
        gpuChart = new Chart(gpuCtx, {
            type: 'line',
            data: {
                labels: gpuHistoryData.length ? gpuHistoryData.map(d => d.time) : ['無測試數據'],
                datasets: [{
                    label: 'GPU 影格率',
                    data: gpuHistoryData.length ? gpuHistoryData.map(d => d.score) : [0],
                    borderColor: '#7c3aed',
                    backgroundColor: 'rgba(124, 58, 237, 0.1)',
                    fill: true,
                    tension: 0.3,
                    pointRadius: 3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        ticks: { color: '#475569', autoSkip: true, maxTicksLimit: 8 },
                        title: { display: true, text: '測試倒數時間 (分:秒)', color: '#475569' }
                    },
                    y: {
                        beginAtZero: true,
                        ticks: { color: '#475569' },
                        title: { display: true, text: '即時幀率 (FPS)', color: '#475569' }
                    }
                }
            }
        });
    }

    function saveCpuHistory(timeLabel, score) {
        cpuHistoryData.push({ time: timeLabel, score: score });
    }

    function saveGpuHistory(timeLabel, score) {
        gpuHistoryData.push({ time: timeLabel, score: score });
    }

    function clearHistory() {
        cpuHistoryData = [];
        gpuHistoryData = [];
        updateCharts();
    }

    function exportCSV() {
        let csvContent = "\uFEFF";
        csvContent += "時間戳記 (倒數),CPU 算力得分,GPU 即時幀率 (FPS)\n";

        const maxLen = Math.max(cpuHistoryData.length, gpuHistoryData.length);
        if (maxLen === 0) {
            alert("目前尚無測試數據可供匯出，請先執行 CPU 或 GPU 測試。");
            return;
        }

        for (let i = 0; i < maxLen; i++) {
            const time = cpuHistoryData[i]?.time || gpuHistoryData[i]?.time || "-";
            const cpuScore = cpuHistoryData[i]?.score ?? "-";
            const gpuFps = gpuHistoryData[i]?.score ?? "-";
            csvContent += `"${time}",${cpuScore},${gpuFps}\n`;
        }

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `benchmark_data_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
    }
</script>
</body>
</html>
