<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高效能系統基準測試平台</title>
    <!-- Chart.js 圖表庫 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* 側邊導覽列 */
        #sidebar {
            width: 240px;
            background-color: #0b1120;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-right: 1px solid #334155;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid #334155;
            color: var(--text-main);
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
            font-size: 0.95rem;
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: var(--accent-blue);
            border-color: var(--accent-blue);
            color: white;
        }

        /* 主要內容區 */
        #main-content {
            flex: 1;
            padding: 30px;
            max-width: 900px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .header-bar {
            margin-bottom: 25px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }

        .header-bar h2 {
            margin: 0;
            font-size: 1.6rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            display: none; /* 預設全部隱藏，由 JS 控制顯示 */
        }

        .card.active-page {
            display: block; /* 僅顯示當前頁面 */
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .score-box {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #334155;
        }

        .score-val {
            font-size: 2.5rem;
            font-weight: bold;
            color: #60a5fa;
            margin: 15px 0;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button.action-btn {
            flex: 1;
            min-width: 140px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: 0.2s;
            font-size: 0.95rem;
        }

        .btn-blue { background-color: var(--accent-blue); }
        .btn-blue:hover { background-color: #2563eb; }
        .btn-red { background-color: var(--accent-red); }
        .btn-red:hover { background-color: #dc2626; }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 進度條樣式 📊 */
        .progress-box {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }

        .progress-bar-bg {
            width: 100%;
            background-color: #334155;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--accent-blue);
            width: 0%;
            transition: width 0.1s ease;
        }

        #webgl-canvas {
            width: 100%;
            height: 320px;
            border-radius: 8px;
            background-color: #000;
            display: block;
            margin-bottom: 20px;
        }

        .info-list p {
            font-size: 1.1rem;
            line-height: 1.8;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <!-- 側邊選單 -->
    <div id="sidebar">
        <h3 style="margin-bottom: 15px;">📊 系統選單</h3>
        <button class="nav-btn active" id="nav-info" onclick="switchPage('info-sec', 'nav-info')">🖥️ 系統資訊概覽</button>
        <button class="nav-btn" id="nav-cpu" onclick="switchPage('cpu-sec', 'nav-cpu')">💻 CPU 效能測試</button>
        <button class="nav-btn" id="nav-gpu" onclick="switchPage('gpu-sec', 'nav-gpu')">🎮 GPU 繪圖測試</button>
        <button class="nav-btn" id="nav-chart" onclick="switchPage('chart-sec', 'nav-chart')">📈 歷史趨勢圖</button>
    </div>

    <!-- 主頁面容器 -->
    <div id="main-content">
        <div class="header-bar">
            <h2>硬體效能測試平台</h2>
        </div>

        <!-- 1. 系統資訊頁面 -->
        <div class="card active-page" id="info-sec">
            <h3>🖥️ 檢測裝置資訊</h3>
            <hr style="border-color: #334155; margin: 15px 0;">
            <div class="info-list">
                <p><strong>處理器 (CPU)：</strong> <span id="device-name" style="color: #60a5fa;">檢測中...</span></p>
                <p><strong>核心數量：</strong> <span id="device-cores" style="color: #60a5fa;">--</span> 核</p>
            </div>
        </div>

        <!-- 2. CPU 跑分頁面 -->
        <div class="card" id="cpu-sec">
            <h3>💻 CPU 核心運算效能評測</h3>
            <div class="grid-2">
                <div class="score-box">
                    <h4>單核算力評分 (Single-Core)</h4>
                    <div class="score-val" id="single-score">--</div>
                    <small>耗時：<span id="single-time">--</span></small>
                </div>
                <div class="score-box">
                    <h4>多核算力評分 (Multi-Core)</h4>
                    <div class="score-val" id="multi-score">--</div>
                    <small>耗時：<span id="multi-time">--</span></small>
                </div>
            </div>

            <div class="btn-group">
                <button class="action-btn btn-blue" id="btn-single" onclick="startTest('single')">⚡ 僅測單核</button>
                <button class="action-btn btn-blue" id="btn-multi" onclick="startTest('multi')">🚀 僅測多核</button>
                <button class="action-btn btn-blue" id="btn-all" onclick="startTest('all')">🔥 執行完整 CPU 測試</button>
                <button class="action-btn btn-red" id="btn-stop" onclick="stopCpuTest()" disabled>⏹️ 中途停止測試</button>
            </div>

            <!-- 📊 即時進度條區域 -->
            <div class="progress-box" id="cpu-progress-box" style="display: none;">
                <div style="display: flex; justify-content: space-between; font-size: 0.95rem;">
                    <span id="progress-title">⚡ 測試進行中...</span>
                    <span id="progress-text" style="color: #60a5fa; font-weight: bold;">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-bar"></div>
                </div>
            </div>
        </div>

        <!-- 3. GPU 跑分頁面 -->
        <div class="card" id="gpu-sec">
            <h3>🎮 GPU 3D 繪圖與渲染壓力測試</h3>
            <canvas id="webgl-canvas"></canvas>
            <div class="grid-2">
                <div class="score-box">
                    <h4>平均繪圖幀數 (FPS)</h4>
                    <div class="score-val" id="gpu-fps">--</div>
                </div>
                <div class="score-box">
                    <h4>GPU 綜合效能評分</h4>
                    <div class="score-val" id="gpu-score">--</div>
                </div>
            </div>
            <div class="btn-group">
                <button class="action-btn btn-blue" id="gpu-btn" onclick="startGpuBenchmark()">🚀 開始 3D 渲染壓力測試</button>
            </div>
        </div>

        <!-- 4. 歷史圖表頁面 -->
        <div class="card" id="chart-sec">
            <h3>📈 效能數據歷史趨勢圖</h3>
            <div style="margin-top: 20px;">
                <canvas id="historyChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let currentEventSource = null;
        let historyChart = null;

        // 初始化
        window.onload = function() {
            fetchSystemInfo();
            initChart();
        };

        // 單頁切換邏輯
        function switchPage(pageId, navId) {
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => card.classList.remove('active-page'));

            const navBtns = document.querySelectorAll('.nav-btn');
            navBtns.forEach(btn => btn.classList.remove('active'));

            document.getElementById(pageId).classList.add('active-page');
            document.getElementById(navId).classList.add('active');
        }

        // 取得 CPU 資訊
        function fetchSystemInfo() {
            fetch('/api/get-info')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('device-name').innerText = data.cpu_name;
                    document.getElementById('device-cores').innerText = data.cores;
                })
                .catch(() => {
                    document.getElementById('device-name').innerText = "無法辨識處理器資訊";
                });
        }

        // 啟動 CPU 測試
        function startTest(type) {
            setCpuButtonsState(true);
            document.getElementById('cpu-progress-box').style.display = 'block';

            if (type === 'single') {
                runStreamTest('/api/run-single-stream', '⚡ 單核測試中...', 'single');
            } else if (type === 'multi') {
                runStreamTest('/api/run-multi-stream', '🚀 多核測試中...', 'multi');
            } else if (type === 'all') {
                // 先跑單核，完成後再接著跑多核
                runStreamTest('/api/run-single-stream', '🔥 [1/2] 單核測試中...', 'single', () => {
                    runStreamTest('/api/run-multi-stream', '🔥 [2/2] 多核測試中...', 'multi');
                });
            }
        }

        // 核心 SSE 串流處理函式 📡
        function runStreamTest(apiUrl, title, mode, onCompleteCallback = null) {
            document.getElementById('progress-title').innerText = title;
            document.getElementById('progress-bar').style.width = '0%';
            document.getElementById('progress-text').innerText = '0%';

            currentEventSource = new EventSource(apiUrl);

            currentEventSource.onmessage = function(event) {
                const data = JSON.parse(event.data);

                // 更新進度條 📊
                document.getElementById('progress-bar').style.width = data.progress + '%';
                document.getElementById('progress-text').innerText = data.progress + '%';

                // 完成時處置 🏁
                if (data.status === 'completed') {
                    if (mode === 'single') {
                        document.getElementById('single-score').innerText = data.single_score;
                        document.getElementById('single-time').innerText = data.single_time;
                    } else if (mode === 'multi') {
                        document.getElementById('multi-score').innerText = data.multi_score;
                        document.getElementById('multi-time').innerText = data.multi_time;
                    }

                    // 關閉目前串流
                    currentEventSource.close();
                    currentEventSource = null;

                    // 如果有下一個任務（例如完整測試），繼續執行；否則收尾
                    if (onCompleteCallback) {
                        onCompleteCallback();
                    } else {
                        // 隱藏進度條並恢復按鈕狀態 🙈
                        document.getElementById('cpu-progress-box').style.display = 'none';
                        setCpuButtonsState(false);

                        const sScore = parseInt(document.getElementById('single-score').innerText) || 0;
                        const mScore = parseInt(document.getElementById('multi-score').innerText) || 0;
                        updateChart(sScore, mScore);
                    }
                }
            };

            currentEventSource.onerror = function() {
                alert("測試發生異常連線中斷。");
                stopCpuTest();
            };
        }

        // 中途停止測試 ⏹️
        function stopCpuTest() {
            if (currentEventSource) {
                currentEventSource.close();
                currentEventSource = null;
            }
            document.getElementById('cpu-progress-box').style.display = 'none';
            setCpuButtonsState(false);
        }

        // 按鈕狀態控制 🎛️
        function setCpuButtonsState(isTesting) {
            document.getElementById('btn-single').disabled = isTesting;
            document.getElementById('btn-multi').disabled = isTesting;
            document.getElementById('btn-all').disabled = isTesting;
            document.getElementById('btn-stop').disabled = !isTesting;
        }

        // GPU 測試
        function startGpuBenchmark() {
            const btn = document.getElementById('gpu-btn');
            const canvas = document.getElementById('webgl-canvas');
            btn.disabled = true;

            canvas.width = canvas.clientWidth * window.devicePixelRatio;
            canvas.height = canvas.clientHeight * window.devicePixelRatio;

            const gl = canvas.getContext('webgl');
            if (!gl) {
                alert('您的瀏覽器不支援 WebGL。');
                btn.disabled = false;
                return;
            }

            const vsSource = `
                attribute vec3 aPosition;
                uniform float uTime;
                varying vec3 vColor;
                void main() {
                    vec3 pos = aPosition;
                    pos.x += sin(uTime * 0.5 + pos.y * 10.0) * 0.2;
                    pos.y += cos(uTime * 0.3 + pos.x * 10.0) * 0.2;
                    vColor = vec3(sin(pos.x * 10.0 + uTime) * 0.5 + 0.5, cos(pos.y * 10.0) * 0.5 + 0.5, 0.8);
                    gl_Position = vec4(pos * 0.8, 1.0);
                    gl_PointSize = 3.0;
                }
            `;

            const fsSource = `
                precision mediump float;
                varying vec3 vColor;
                void main() {
                    float dist = length(gl_PointCoord - vec2(0.5));
                    if (dist > 0.5) discard;
                    gl_FragColor = vec4(vColor, 0.8);
                }
            `;

            function createShader(gl, type, source) {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, source);
                gl.compileShader(shader);
                return shader;
            }

            const program = gl.createProgram();
            gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
            gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
            gl.linkProgram(program);
            gl.useProgram(program);

            const particleCount = 150000;
            const positions = new Float32Array(particleCount * 3);
            for (let i = 0; i < particleCount * 3; i++) {
                positions[i] = (Math.random() - 0.5) * 2.2;
            }

            const buffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
            gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

            const aPosition = gl.getAttribLocation(program, 'aPosition');
            gl.enableVertexAttribArray(aPosition);
            gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 0, 0);

            const uTime = gl.getUniformLocation(program, 'uTime');
            gl.viewport(0, 0, canvas.width, canvas.height);

            let frameCount = 0;
            let startTime = performance.now();
            const duration = 10;

            function render() {
                const currentTime = performance.now();
                const elapsed = (currentTime - startTime) / 1000;

                btn.innerText = `⏳ 3D 渲染壓力測試中 (${Math.ceil(duration - elapsed)} 秒)...`;

                gl.clearColor(0.05, 0.05, 0.1, 1.0);
                gl.clear(gl.COLOR_BUFFER_BIT);

                gl.uniform1f(uTime, elapsed);
                gl.drawArrays(gl.POINTS, 0, particleCount);

                frameCount++;

                if (elapsed < duration) {
                    requestAnimationFrame(render);
                } else {
                    const fps = (frameCount / elapsed).toFixed(1);
                    const score = Math.round(fps * 120);

                    document.getElementById('gpu-fps').innerText = fps;
                    document.getElementById('gpu-score').innerText = score;

                    btn.disabled = false;
                    btn.innerText = "🚀 重新測試 GPU";
                }
            }

            render();
        }

        // 初始化歷史圖表
        function initChart() {
            const ctx = document.getElementById('historyChart').getContext('2d');
            historyChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        { label: '單核分數', data: [], borderColor: '#60a5fa', tension: 0.2 },
                        { label: '多核分數', data: [], borderColor: '#34d399', tension: 0.2 }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#334155' } },
                        x: { grid: { color: '#334155' } }
                    }
                }
            });
        }

        function updateChart(single, multi) {
            const timeLabel = new Date().toLocaleTimeString();
            historyChart.data.labels.push(timeLabel);
            historyChart.data.datasets[0].data.push(single);
            historyChart.data.datasets[1].data.push(multi);
            historyChart.update();
        }
    </script>
</body>
</html>
